<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d1b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Создай своё Minecraft-достижение: выбери предмет, добавь текст и скачай PNG бесплатно.">
  <title>UNLOCKD — создай своё достижение</title>
  <link rel="stylesheet" href="style.css?v=icon-size-2">
  <script defer src="assets/vendor/html2canvas.min.js"></script>
  <script defer src="minecraft.js?v=more-icons-1"></script>
  <script defer src="script.js?v=icon-size-2"></script>
</head>
<body>
<main class="page">
  <header class="header"><a class="brand" href="./" aria-label="UNLOCKD — главная"><span class="brand-mark">U</span>UNLOCKD<span class="brand-dot">.</span></a></header>
  <section class="intro"><h1>Генератор кастомных достижений</h1></section>
  <div class="layout">
    <section class="panel editor" aria-labelledby="editorHeading">
      <div class="section-heading"><h2 id="editorHeading">Создать достижение</h2><span class="step">01 / EDITOR</span></div>
      <label for="platform">Платформа</label><select id="platform"><option value="minecraft">Minecraft</option><option value="steam">Steam · базовый стиль</option></select>
      <div id="minecraftOptions" class="field">
        <label>Цвета текста</label>
        <div class="color-settings">
          <div class="color-setting">
            <span>Заголовок</span>
            <select id="headingColorPreset" aria-label="Цвет заголовка">
              <option value="#000000">Чёрный</option><option value="#0000aa">Тёмно-синий</option><option value="#00aa00">Тёмно-зелёный</option><option value="#00aaaa">Тёмно-бирюзовый</option><option value="#aa0000">Тёмно-красный</option><option value="#aa00aa">Тёмно-фиолетовый</option><option value="#ffaa00">Золотой</option><option value="#aaaaaa">Серый</option><option value="#555555">Тёмно-серый</option><option value="#5555ff">Синий</option><option value="#55ff55">Зелёный</option><option value="#55ffff">Бирюзовый</option><option value="#ff5555">Красный</option><option value="#ff55ff">Розово-фиолетовый</option><option value="#ffff55" selected>Жёлтый</option><option value="#ffffff">Белый</option><option value="custom">Свой RGB</option>
            </select>
            <input id="headingColor" type="color" value="#ffff55" aria-label="Свой цвет заголовка">
          </div>
          <div class="color-setting">
            <span>Название</span>
            <select id="titleColorPreset" aria-label="Цвет названия">
              <option value="#000000">Чёрный</option><option value="#0000aa">Тёмно-синий</option><option value="#00aa00">Тёмно-зелёный</option><option value="#00aaaa">Тёмно-бирюзовый</option><option value="#aa0000">Тёмно-красный</option><option value="#aa00aa">Тёмно-фиолетовый</option><option value="#ffaa00">Золотой</option><option value="#aaaaaa">Серый</option><option value="#555555">Тёмно-серый</option><option value="#5555ff">Синий</option><option value="#55ff55">Зелёный</option><option value="#55ffff">Бирюзовый</option><option value="#ff5555">Красный</option><option value="#ff55ff">Розово-фиолетовый</option><option value="#ffff55">Жёлтый</option><option value="#ffffff" selected>Белый</option><option value="custom">Свой RGB</option>
            </select>
            <input id="titleColor" type="color" value="#ffffff" aria-label="Свой цвет названия">
          </div>
          <div class="color-setting">
            <span>Описание</span>
            <select id="descriptionColorPreset" aria-label="Цвет описания">
              <option value="#000000">Чёрный</option><option value="#0000aa">Тёмно-синий</option><option value="#00aa00">Тёмно-зелёный</option><option value="#00aaaa">Тёмно-бирюзовый</option><option value="#aa0000">Тёмно-красный</option><option value="#aa00aa">Тёмно-фиолетовый</option><option value="#ffaa00">Золотой</option><option value="#aaaaaa" selected>Серый</option><option value="#555555">Тёмно-серый</option><option value="#5555ff">Синий</option><option value="#55ff55">Зелёный</option><option value="#55ffff">Бирюзовый</option><option value="#ff5555">Красный</option><option value="#ff55ff">Розово-фиолетовый</option><option value="#ffff55">Жёлтый</option><option value="#ffffff">Белый</option><option value="custom">Свой RGB</option>
            </select>
            <input id="descriptionColor" type="color" value="#aaaaaa" aria-label="Свой цвет описания">
          </div>
        </div>
        <p id="toastHint" class="help" role="status">Если описание пустое, оно не показывается.</p>
      </div>
      <div class="field"><label for="eyebrowInput">Строка уведомления</label><input id="eyebrowInput" value="Achievement Get!" maxlength="40"></div>
      <div class="field"><label for="titleInput">Название</label><input id="titleInput" value="Алмазы!" maxlength="60"></div>
      <div class="field"><label for="descriptionInput">Описание <span>необязательно</span></label><textarea id="descriptionInput" maxlength="140" rows="2" placeholder="Описание"></textarea></div>
      <div class="divider"></div>
      <label for="itemSearch">Иконка из Minecraft</label><input id="itemSearch" type="search" placeholder="Поиск: diamond, sword, алмаз…" autocomplete="off" aria-describedby="searchStatus">
      <p id="searchStatus" class="help" role="status">Загружаем каталог…</p>
      <div id="itemResults" class="item-results" aria-label="Предметы Minecraft"></div>
      <p class="selected">Выбрано: <strong id="selectedName">Diamond</strong></p>
      <details><summary>Своя картинка или emoji</summary>
        <label for="imageInput">Загрузить PNG, JPG или WebP · до 5 МБ</label><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
        <button id="clearImageBtn" class="secondary small" type="button">Вернуть выбранный предмет</button>
        <label for="emojiInput">Emoji · дополнительный вариант</label><input id="emojiInput" maxlength="8" placeholder="Вместо предмета или картинки">
      </details>
    </section>
    <section class="preview-wrap" aria-label="Предпросмотр достижения">
      <div class="panel preview-panel">
        <div class="preview-stage"><div id="previewSizer">
          <div id="minecraftToast"><canvas id="minecraftPreview" width="320" height="64" role="img" aria-label="Minecraft-достижение"></canvas></div>
          <div id="achievement" class="achievement steam" hidden>
          <div class="achievement-icon"><img id="imagePreview" src="assets/items/diamond.png" alt=""><span id="emojiPreview" hidden></span></div>
          <div class="achievement-text"><div id="eyebrow" class="eyebrow">Achievement Get!</div><div id="titlePreview" class="achievement-title">Алмазы!</div><div id="descriptionPreview" class="achievement-description"></div></div>
        </div></div></div>
        <div class="action-row">
          <button class="primary" id="downloadBtn" type="button">↓ Скачать</button>
          <button class="secondary action-copy" id="copyBtn" type="button">Скопировать</button>
        </div>
        <p id="appStatus" class="help status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </div>
  <footer><span>Неофициальный проект. Не связан с Mojang или Microsoft.</span></footer>
</main>
</body>
</html>
