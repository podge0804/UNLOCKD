<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNLOCKD — Minecraft Achievement Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #1c1c1c, #101010);
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      margin: 0 0 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #c8c8c8;
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #191919;
      border: 2px solid #2d2d2d;
      border-radius: 16px;
      padding: 18px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #d8d8d8;
      font-weight: 700;
      font-size: 14px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: #111;
      border: 2px solid #323232;
      border-radius: 12px;
      color: #fff;
      padding: 12px;
      font-size: 15px;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .primary {
      background: #71aa34;
      color: #fff;
    }

    .secondary {
      background: #2c2c2c;
      color: #fff;
    }

    .hint {
      margin-top: 12px;
      color: #a9a9a9;
      font-size: 13px;
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .achievement-card {
      width: 100%;
      max-width: 520px;
      min-height: 150px;
      background: linear-gradient(180deg, #4d3317, #2f1f0f);
      border: 4px solid #24180b;
      box-shadow:
        inset 0 0 0 4px #7d5a30,
        0 10px 24px rgba(0,0,0,0.35);
      border-radius: 6px;
      padding: 16px;
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
    }

    .achievement-top {
      color: #ffff66;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #3a2c10;
    }

    .achievement-content {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .achievement-icon {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      background: #7bbf43;
      border: 3px solid #274913;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      overflow: hidden;
    }

    .achievement-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .achievement-text {
      flex: 1;
      min-width: 0;
    }

    .achievement-title {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 8px;
      word-break: break-word;
      text-shadow: 2px 2px 0 #2b1e0d;
    }

    .achievement-desc {
      font-size: 15px;
      line-height: 1.35;
      color: #f0f0f0;
      word-break: break-word;
      text-shadow: 1px 1px 0 #2b1e0d;
    }

    .type-note {
      font-size: 13px;
      color: #bababa;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="logo">UNLOCKD</h1>
    <p class="subtitle">Minecraft achievement generator — первая версия</p>

    <div class="layout">
      <div class="panel">
        <h2>Настройки</h2>

        <div class="field">
          <label for="titleInput">Название достижения</label>
          <input id="titleInput" type="text" value="Начало пути" placeholder="Введите название" />
        </div>

        <div class="field">
          <label for="descInput">Описание</label>
          <textarea id="descInput" placeholder="Введите описание">Ты сделал первый шаг и открыл свою первую ачивку.</textarea>
        </div>

        <div class="field">
          <label for="typeInput">Тип</label>
          <select id="typeInput">
            <option value="achievement">Обычное достижение</option>
            <option value="goal">Цель</option>
            <option value="challenge">Испытание</option>
          </select>
        </div>

        <div class="field">
          <label for="emojiInput">Иконка / emoji</label>
          <input id="emojiInput" type="text" value="⛏️" placeholder="например: ⛏️ 💎 🌾 🧱" />
        </div>

        <div class="field">
          <label for="imageInput">Или загрузи свою картинку</label>
          <input id="imageInput" type="file" accept="image/*" />
        </div>

        <div class="buttons">
          <button class="primary" id="downloadBtn">Скачать PNG</button>
          <button class="secondary" id="resetBtn">Сбросить пример</button>
        </div>

        <div class="hint">
          сначала можно пользоваться emoji, а потом улучшим проект и добавим больше minecraft-иконок и стилей
        </div>
      </div>

      <div class="panel preview-box">
        <h2>Предпросмотр</h2>

        <div id="achievementCard" class="achievement-card">
          <div id="topLabel" class="achievement-top">Achievement Get!</div>

          <div class="achievement-content">
            <div class="achievement-icon" id="iconBox">
              <span id="emojiPreview">⛏️</span>
              <img id="imagePreview" alt="icon" />
            </div>

            <div class="achievement-text">
              <div class="achievement-title" id="titlePreview">Начало пути</div>
              <div class="achievement-desc" id="descPreview">
                Ты сделал первый шаг и открыл свою первую ачивку.
              </div>
            </div>
          </div>
        </div>

        <div class="type-note" id="typeNote">
          Тип: обычное достижение
        </div>
      </div>
    </div>
  </div>

  <script>
    const titleInput = document.getElementById("titleInput");
    const descInput = document.getElementById("descInput");
    const typeInput = document.getElementById("typeInput");
    const emojiInput = document.getElementById("emojiInput");
    const imageInput = document.getElementById("imageInput");

    const topLabel = document.getElementById("topLabel");
    const titlePreview = document.getElementById("titlePreview");
    const descPreview = document.getElementById("descPreview");
    const emojiPreview = document.getElementById("emojiPreview");
    const imagePreview = document.getElementById("imagePreview");
    const typeNote = document.getElementById("typeNote");

    function getTypeData(type) {
      if (type === "goal") {
        return {
          label: "Goal Reached!",
          note: "Тип: цель"
        };
      }

      if (type === "challenge") {
        return {
          label: "Challenge Complete!",
          note: "Тип: испытание"
        };
      }

      return {
        label: "Achievement Get!",
        note: "Тип: обычное достижение"
      };
    }

    function updatePreview() {
      const typeData = getTypeData(typeInput.value);

      topLabel.textContent = typeData.label;
      typeNote.textContent = typeData.note;
      titlePreview.textContent = titleInput.value || "Без названия";
      descPreview.textContent = descInput.value || "Без описания";
      emojiPreview.textContent = emojiInput.value || "🏆";
    }

    titleInput.addEventListener("input", updatePreview);
    descInput.addEventListener("input", updatePreview);
    typeInput.addEventListener("change", updatePreview);
    emojiInput.addEventListener("input", updatePreview);

    imageInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) {
        imagePreview.style.display = "none";
        emojiPreview.style.display = "inline";
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        imagePreview.src = e.target.result;
        imagePreview.style.display = "block";
        emojiPreview.style.display = "none";
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      titleInput.value = "Начало пути";
      descInput.value = "Ты сделал первый шаг и открыл свою первую ачивку.";
      typeInput.value = "achievement";
      emojiInput.value = "⛏️";
      imageInput.value = "";
      imagePreview.src = "";
      imagePreview.style.display = "none";
      emojiPreview.style.display = "inline";
      updatePreview();
    });

    document.getElementById("downloadBtn").addEventListener("click", async () => {
      const card = document.getElementById("achievementCard");

      const canvas = await html2canvas(card, {
        backgroundColor: null,
        scale: 2
      });

      const link = document.createElement("a");
      link.download = "minecraft-achievement.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    updatePreview();
  </script>
</body>
</html>
