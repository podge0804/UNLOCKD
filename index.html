<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNLOCKD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 0%, rgba(123, 76, 255, 0.15), transparent 35%),
        #0d0d14;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .brand {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa8ba;
      margin-bottom: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: rgba(25, 24, 35, 0.92);
      border: 1px solid #302e40;
      border-radius: 18px;
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #ccc9da;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #393747;
      background: #12121a;
      color: #fff;
      border-radius: 11px;
      padding: 12px 13px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #7655ff;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #7655ff;
      color: #fff;
    }

    .secondary {
      background: #282635;
      color: #fff;
    }

    .preview-wrap {
      min-width: 0;
    }

    .preview-stage {
      background: #111018;
      border: 1px solid #2c2a39;
      border-radius: 15px;
      padding: 24px;
      overflow-x: auto;
    }

    /* ---------- MINECRAFT ---------- */

    .achievement.minecraft {
      width: 520px;
      min-height: 104px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 13px 17px;

      background:
        linear-gradient(#2d2d2d, #1a1a1a);

      border: 4px solid #050505;
      box-shadow:
        inset 0 0 0 2px #565656,
        inset 0 0 0 4px #252525,
        0 8px 20px rgba(0,0,0,.35);

      border-radius: 3px;
      font-family: "Press Start 2P", monospace;
    }

    .minecraft .achievement-icon {
      width: 72px;
      height: 72px;
      background: #171717;
      border: 3px solid #050505;
      box-shadow:
        inset 0 0 0 2px #555,
        inset 0 0 0 4px #242424;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      image-rendering: pixelated;
    }

    .minecraft .achievement-icon span {
      font-size: 32px;
      line-height: 1;
    }

    .minecraft .achievement-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    .minecraft .eyebrow {
      color: #ffff55;
      font-size: 10px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .minecraft .achievement-title {
      font-size: 13px;
      line-height: 1.45;
      color: white;
      margin-bottom: 7px;
    }

    .minecraft .achievement-description {
      font-size: 8px;
      line-height: 1.6;
      color: #cfcfcf;
    }

    /* ---------- STEAM ---------- */

    .achievement.steam {
      width: 560px;
      min-height: 105px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 16px;

      background:
        linear-gradient(100deg, #161b20, #222a31 75%, #171b1f);

      border: 1px solid #35424d;
      border-radius: 2px;

      box-shadow:
        0 8px 24px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.04);

      font-family: Inter, Arial, sans-serif;
    }

    .steam .achievement-icon {
      width: 78px;
      height: 78px;
      flex-shrink: 0;
      overflow: hidden;
      background: #0c0f12;
      border: 1px solid #39454e;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .steam .achievement-icon span {
      font-size: 36px;
    }

    .steam .achievement-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .steam .eyebrow {
      font-size: 11px;
      color: #7fbbe5;
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 5px;
    }

    .steam .achievement-title {
      font-size: 18px;
      font-weight: 600;
      color: #e8edf1;
      margin-bottom: 4px;
    }

    .steam .achievement-description {
      color: #aeb8bf;
      font-size: 13px;
      line-height: 1.4;
    }

    .achievement-text {
      min-width: 0;
      flex: 1;
    }

    .achievement-title,
    .achievement-description {
      overflow-wrap: anywhere;
    }

    .help {
      color: #8f8c9e;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="brand">UNLOCKD</div>
    <div class="subtitle">Achievement popup generator</div>

    <div class="layout">

      <section class="panel">
        <h2>Настройки</h2>

        <div class="field">
          <label for="platform">Стиль</label>
          <select id="platform">
            <option value="minecraft">Minecraft</option>
            <option value="steam">Steam</option>
          </select>
        </div>

        <div class="field">
          <label for="titleInput">Название</label>
          <input
            id="titleInput"
            value="Алмазы!"
            maxlength="60"
          />
        </div>

        <div class="field">
          <label for="descriptionInput">Описание</label>
          <textarea
            id="descriptionInput"
            maxlength="140"
          >Добудьте алмазы с помощью железной кирки.</textarea>
        </div>

        <div class="field">
          <label for="emojiInput">Emoji / простая иконка</label>
          <input
            id="emojiInput"
            value="💎"
            maxlength="8"
          />
        </div>

        <div class="field">
          <label for="imageInput">Своя картинка</label>
          <input
            id="imageInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          />
        </div>

        <div class="buttons">
          <button class="primary" id="downloadBtn">
            Скачать PNG
          </button>

          <button class="secondary" id="clearImageBtn">
            Убрать картинку
          </button>
        </div>

        <div class="help">
          Загруженная картинка заменяет emoji.
        </div>
      </section>


      <section class="panel preview-wrap">
        <h2>Предпросмотр</h2>

        <div class="preview-stage">

          <div
            id="achievement"
            class="achievement minecraft"
          >

            <div class="achievement-icon">
              <span id="emojiPreview">💎</span>
              <img
                id="imagePreview"
                alt=""
                style="display:none"
              >
            </div>

            <div class="achievement-text">

              <div
                class="eyebrow"
                id="eyebrow"
              >
                Achievement Get!
              </div>

              <div
                class="achievement-title"
                id="titlePreview"
              >
                Алмазы!
              </div>

              <div
                class="achievement-description"
                id="descriptionPreview"
              >
                Добудьте алмазы с помощью железной кирки.
              </div>

            </div>
          </div>

        </div>
      </section>

    </div>
  </main>


  <script>
    const platform = document.getElementById("platform");
    const titleInput = document.getElementById("titleInput");
    const descriptionInput = document.getElementById("descriptionInput");
    const emojiInput = document.getElementById("emojiInput");

    const imageInput = document.getElementById("imageInput");
    const clearImageBtn = document.getElementById("clearImageBtn");

    const achievement = document.getElementById("achievement");

    const eyebrow = document.getElementById("eyebrow");
    const titlePreview = document.getElementById("titlePreview");
    const descriptionPreview =
      document.getElementById("descriptionPreview");

    const emojiPreview =
      document.getElementById("emojiPreview");

    const imagePreview =
      document.getElementById("imagePreview");


    function updatePreview() {

      achievement.className =
        "achievement " + platform.value;

      titlePreview.textContent =
        titleInput.value || "Без названия";

      descriptionPreview.textContent =
        descriptionInput.value || "";

      emojiPreview.textContent =
        emojiInput.value || "🏆";

      if (platform.value === "minecraft") {
        eyebrow.textContent = "Achievement Get!";
      } else {
        eyebrow.textContent = "ACHIEVEMENT UNLOCKED";
      }
    }


    [
      platform,
      titleInput,
      descriptionInput,
      emojiInput
    ].forEach(el => {

      el.addEventListener(
        "input",
        updatePreview
      );

      el.addEventListener(
        "change",
        updatePreview
      );
    });


    imageInput.addEventListener(
      "change",
      function () {

        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = event => {

          imagePreview.src =
            event.target.result;

          imagePreview.style.display =
            "block";

          emojiPreview.style.display =
            "none";
        };

        reader.readAsDataURL(file);
      }
    );


    clearImageBtn.addEventListener(
      "click",
      () => {

        imageInput.value = "";

        imagePreview.src = "";

        imagePreview.style.display =
          "none";

        emojiPreview.style.display =
          "inline";
      }
    );


    document
      .getElementById("downloadBtn")
      .addEventListener(
        "click",
        async () => {

          const canvas =
            await html2canvas(
              achievement,
              {
                scale: 3,
                backgroundColor: null,
                useCORS: true
              }
            );

          const link =
            document.createElement("a");

          link.download =
            platform.value +
            "-achievement.png";

          link.href =
            canvas.toDataURL("image/png");

          link.click();
        }
      );


    updatePreview();
  </script>
</body>
</html>
